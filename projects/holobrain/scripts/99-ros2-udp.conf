# ROS 2 / FastDDS UDP buffer tuning for the HoloBrain inference computer.
# Install: sudo install -m 0644 99-ros2-udp.conf /etc/sysctl.d/ && sudo sysctl --system
# The default 208 KB limit overflows on 30 Hz depth+color images and causes
# RELIABLE joint_states retransmission stalls (stale feedback timeouts).
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.core.rmem_default = 8388608
net.core.wmem_default = 8388608
net.core.netdev_max_backlog = 10000
